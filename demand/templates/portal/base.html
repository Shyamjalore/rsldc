<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Admin Portal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn { padding: 0.5rem 1.2rem; border-radius: 8px; font-weight: 500; font-size: 0.9rem; border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; }
        .btn-primary { background: #3182ce; color: #fff; }
        .btn-primary:hover { background: #2b6cb0; }
        .btn-success { background: #38a169; color: #fff; }
        .btn-success:hover { background: #2f855a; }
        .btn-danger { background: #e53e3e; color: #fff; }
        .btn-danger:hover { background: #c53030; }
        .btn-outline { background: transparent; border: 1px solid #d1d5db; color: #4a5568; }
        .btn-outline:hover { background: #f7fafc; }
        .btn-sm { padding: 0.25rem 0.8rem; font-size: 0.8rem; }
        .tag { display: inline-block; background: #ebf4ff; color: #2b6cb0; padding: 0.15rem 0.7rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; border-radius: 8px; color: #4a5568; text-decoration: none; transition: 0.2s; }
        .sidebar-link:hover { background: #edf2f7; }
        .sidebar-link.active { background: #ebf4ff; color: #2b6cb0; font-weight: 500; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Toast -->
    <div id="toast" class="fixed top-4 right-4 px-6 py-3 rounded-lg text-white font-medium z-50 hidden shadow-lg max-w-md">
        <span id="toastMessage"></span>
    </div>

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-lg border-r border-gray-200 flex-shrink-0 min-h-screen">
            <div class="p-4 border-b">
                <h1 class="text-xl font-bold text-blue-600">
                    <i class="fas fa-chart-line mr-2"></i> Portal
                </h1>
                <p class="text-xs text-gray-400">Manpower Demand Dashboard</p>
            </div>
            <nav class="p-3">
                <a href="{% url 'survey:admin_dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="{% url 'survey:admin_surveys' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_surveys' %}active{% endif %}">
                    <i class="fas fa-clipboard-list"></i> Employer Surveys
                </a>
                <a href="{% url 'survey:admin_job_demands' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_job_demands' %}active{% endif %}">
                    <i class="fas fa-briefcase"></i> Job Demands
                </a>
                <a href="{% url 'survey:admin_association_list' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_association_list' %}active{% endif %}">
                    <i class="fas fa-building"></i> Associations
                </a>
                <a href="{% url 'survey:admin_logout' %}" class="sidebar-link text-red-500 hover:text-red-700 hover:bg-red-50 mt-4">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">{% block page_title %}Dashboard{% endblock %}</h2>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-500">
                        <i class="far fa-user mr-1"></i> {{ request.user.username }}
                    </span>
                </div>
            </div>

            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;
            toast.className = `fixed top-4 right-4 px-6 py-3 rounded-lg text-white font-medium z-50 shadow-lg max-w-md`;
            if (type === 'success') toast.classList.add('bg-green-600');
            else if (type === 'error') toast.classList.add('bg-red-600');
            else toast.classList.add('bg-blue-600');
            toast.classList.remove('hidden');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        // CSRF token helper
        function getCSRFToken() {
            return document.querySelector('[name="csrfmiddlewaretoken"]')?.value || '';
        }
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
